<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KR × DG · 3D-Viewer</title>
<meta property="og:title" content="KR × DG · 3D-Viewer">
<meta property="og:description" content="3D-Modell ansehen, drehen und zoomen.">
<style>
  :root { --fg:#ddd; --sub:#888; }
  html, body { margin:0; height:100%; background:#000000; color:var(--fg);
               font-family:system-ui, -apple-system, sans-serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  #brand { position:fixed; top:16px; left:18px; pointer-events:none; user-select:none;
           font-family:"Avenir Next","Helvetica Neue","Segoe UI",system-ui,sans-serif; }
  #brand { display:flex; align-items:center; gap:12px; }
  #brand svg { display:block; filter:drop-shadow(0 0 8px #e0a84a66); }
  #brand .name { font-size:20px; font-weight:700; letter-spacing:.03em; line-height:1.1;
                 color:var(--fg); }
  #brand .by { margin-top:5px; font-size:10px; letter-spacing:.38em; text-transform:uppercase;
               color:var(--sub); white-space:nowrap; }
  #brand .by b { color:#e0a84a; font-weight:700; }
  #ui { position:fixed; bottom:14px; left:10px; right:10px; display:flex; gap:8px;
        flex-wrap:wrap; justify-content:center; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  button, label.btn { background:#262a31cc; color:#eee; border:1px solid #484b52;
        border-radius:999px; padding:9px 14px; font-size:14px; cursor:pointer;
        backdrop-filter:blur(6px); }
  button:hover, label.btn:hover { background:#3a3e45; }
  button.on { background:#e0a84a; border-color:#e0a84a; color:#111; }
  #hint { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          text-align:center; pointer-events:none; color:var(--sub); font-size:18px; padding:20px; }
  #msg { position:fixed; top:68px; left:18px; font-size:12px; color:var(--sub); pointer-events:none; }
  .dd { position:relative; }
  .menu { display:none; position:absolute; bottom:calc(100% + 8px); left:50%;
          transform:translateX(-50%); flex-direction:column; gap:6px; }
  .menu.open { display:flex; }
  .menu button { white-space:nowrap; text-align:left; }
  .menu i { display:inline-block; width:12px; height:12px; border-radius:50%;
            margin-right:8px; border:1px solid #888; vertical-align:-1px; }
  input[type=file] { display:none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="brand">
  <!-- Tesserakt: großer Würfel, kleiner Würfel darin, verbunden an allen Ecken -->
  <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#e0a84a" stroke-linejoin="round" stroke-linecap="round" aria-label="Tesserakt">
    <g stroke-width="1.3">
      <path d="M12 2.5 20.5 7.25v9.5L12 21.5 3.5 16.75v-9.5z"/>
      <path d="M3.5 7.25 12 12l8.5-4.75M12 12v9.5"/>
    </g>
    <g stroke-width="1" opacity=".85">
      <path d="M12 7.25 16.25 9.625v4.75L12 16.75 7.75 14.375v-4.75z"/>
      <path d="M7.75 9.625 12 12l4.25-2.375M12 12v4.75"/>
      <path d="M12 2.5v4.75M20.5 7.25l-4.25 2.375M20.5 16.75l-4.25-2.375M12 21.5v-4.75M3.5 16.75l4.25-2.375M3.5 7.25l4.25 2.375"/>
    </g>
  </svg>
  <div>
    <div class="name">3D-Viewer</div>
    <div class="by">KR <b>×</b> DG</div>
  </div>
</div>
<div id="msg"></div>
<div id="hint">.glb / .gltf / .obj hierher ziehen<br>oder unten „Datei öffnen“ wählen</div>
<div id="ui">
  <label class="btn" id="openLabel">Datei öffnen<input id="file" type="file" accept=".glb,.gltf,.obj"></label>
  <button id="bRot">Auto-Drehen</button>
  <button id="bWire">Drahtgitter</button>
  <div class="dd">
    <button id="bBg">Hintergrund ▾</button>
    <div class="menu" id="menuBg">
      <button data-bg="white"><i style="background:#ffffff"></i>Weiß</button>
      <button data-bg="gray"><i style="background:#808080"></i>Grau</button>
      <button data-bg="black" class="on"><i style="background:#000000"></i>Schwarz</button>
    </div>
  </div>
  <button id="bAxis">Achse kippen</button>
  <button id="bMirror">Spiegel</button>
  <button id="bReset">Zurücksetzen</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pmrem = new THREE.PMREMGenerator(renderer);

// Studio-Umgebung mit hellen Lichtflächen: ergibt scharfe, kontrastreiche Spiegelungen
function makeStudioEnv() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(
    new THREE.BoxGeometry(24, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0x23262c, side: THREE.BackSide })
  ));
  const panel = (w, h, x, y, z, level) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(level, level, level), side: THREE.DoubleSide })
    );
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    env.add(m);
  };
  panel(12, 12, 0, 11.5, 0, 5);       // große Fläche oben
  panel(3, 10, -11.5, 2, 4, 6);       // Streifen links
  panel(3, 10, 11.5, 2, -4, 6);       // Streifen rechts
  panel(10, 3, 0, 1, 11.5, 3);        // Fläche vorne
  panel(14, 14, 0, -11.5, 0, 0.8);    // schwacher Boden
  return pmrem.fromScene(env, 0.01).texture;
}
scene.environment = makeStudioEnv();

const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(3, 5, 4);
scene.add(dir, new THREE.HemisphereLight(0xffffff, 0x444455, 0.6));

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 10000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 2;

let pivot = null, tilted = false, wire = false, mirrorMode = false;

function disposeModel() {
  if (!pivot) return;
  restoreMirrors(pivot);
  scene.remove(pivot);
  pivot.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach(m => m.dispose());
    if (o.getRenderTarget) o.getRenderTarget().dispose();   // Spiegel
  });
  pivot = null;
}

function frame() {
  if (!pivot) return;
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  camera.position.copy(center).add(new THREE.Vector3(1, 0.7, 1).normalize().multiplyScalar(dist));
  controls.target.copy(center);
  controls.update();
}

function applyWire() {
  if (!pivot) return;
  pivot.traverse(o => {
    if (o.material) [].concat(o.material).forEach(m => m.wireframe = wire);
  });
}

// MIRRORS-BEGIN
// Echte Spiegel: ebene Flächen mit Vollmetall-Material (Metall >= 0.9, Rauheit <= 0.1)
// werden durch einen Reflector ersetzt, der die Szene wirklich spiegelt.
function makeMirrors(root) {
  const found = [];
  root.traverse(o => {
    if (!o.isMesh || Array.isArray(o.material)) return;
    const m = o.material;
    if (m.metalness >= 0.9 && m.roughness <= 0.1) found.push(o);
  });
  const made = [];
  for (const mesh of found) {
    const parent = mesh.parent;
    if (!parent) continue;
    const geo = mesh.geometry.clone();
    geo.applyMatrix4(mesh.matrix);                       // in den Raum des Elternobjekts
    const pos = geo.attributes.position;
    const idx = geo.index;
    const ia = idx ? idx.getX(0) : 0, ib = idx ? idx.getX(1) : 1, ic = idx ? idx.getX(2) : 2;
    const va = new THREE.Vector3().fromBufferAttribute(pos, ia);
    const vb = new THREE.Vector3().fromBufferAttribute(pos, ib);
    const vc = new THREE.Vector3().fromBufferAttribute(pos, ic);
    const n = vb.sub(va).cross(vc.sub(va)).normalize();  // Flächennormale (zeigt zur Vorderseite)
    geo.computeBoundingBox();
    const center = geo.boundingBox.getCenter(new THREE.Vector3());
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
    geo.translate(-center.x, -center.y, -center.z);
    geo.applyQuaternion(q.clone().invert());             // Fläche liegt jetzt in der lokalen XY-Ebene
    geo.computeBoundingBox();
    const size = geo.boundingBox.getSize(new THREE.Vector3());
    if (size.z > Math.max(size.x, size.y) * 1e-3) { geo.dispose(); continue; }   // nicht eben: normal lassen
    const dpr = renderer.getPixelRatio();
    const mirror = new Reflector(geo, {
      color: new THREE.Color().setRGB(0.5, 0.5, 0.5, THREE.LinearSRGBColorSpace),  // neutral, keine Färbung
      textureWidth: Math.round(Math.min(1600, innerWidth * dpr)),
      textureHeight: Math.round(Math.min(1600, innerHeight * dpr)),
      clipBias: size.length() * 0.0005
    });
    mirror.name = (mesh.name || 'mirror') + '_reflector';
    mirror.position.copy(center);
    mirror.quaternion.copy(q);
    mirror.userData.originalMesh = mesh;                 // zum Zurückschalten merken
    parent.add(mirror);
    parent.remove(mesh);
    made.push(mirror);
  }
  return made;
}
// MIRRORS-END

// Spiegel wieder durch die ursprünglichen Flächen ersetzen
function restoreMirrors(root) {
  const list = [];
  root.traverse(o => { if (o.userData && o.userData.originalMesh) list.push(o); });
  for (const r of list) {
    const parent = r.parent;
    if (parent) { parent.add(r.userData.originalMesh); parent.remove(r); }
    r.geometry.dispose();
    r.material.dispose();
    r.getRenderTarget().dispose();
  }
}

function setMirrors(on) {
  if (!pivot) return;
  if (on) {
    try { makeMirrors(pivot); } catch (e) { console.warn('Spiegel nicht möglich:', e); }
    applyWire();
  } else {
    restoreMirrors(pivot);
  }
}

function setModel(obj, name) {
  disposeModel();
  pivot = new THREE.Group();
  pivot.add(obj);
  if (mirrorMode) setMirrors(true);
  pivot.rotation.x = tilted ? -Math.PI / 2 : 0;
  applyWire();
  scene.add(pivot);
  frame();
  $('hint').style.display = 'none';
  $('msg').textContent = name;
}

function load(buffer, name) {
  const ext = name.split('.').pop().toLowerCase();
  try {
    if (ext === 'obj') {
      const obj = new OBJLoader().parse(new TextDecoder().decode(buffer));
      const mat = new THREE.MeshStandardMaterial({ color:0xcccccc, roughness:0.6, metalness:0.1, side:THREE.DoubleSide });
      obj.traverse(o => { if (o.isMesh) o.material = mat; });
      setModel(obj, name);
    } else {
      new GLTFLoader().parse(buffer, '', gltf => setModel(gltf.scene, name),
        err => { $('msg').textContent = 'Fehler beim Laden: ' + (err.message || err); });
    }
  } catch (e) {
    $('msg').textContent = 'Fehler beim Laden: ' + e.message;
  }
}

async function loadFile(file) { load(await file.arrayBuffer(), file.name); }

// Modell per Link laden:  ...?model=meinmodell.glb
async function loadFromUrl(path) {
  const url = new URL(path, location.href);
  if (url.origin !== location.origin) { $('msg').textContent = 'Nur Modelle von dieser Seite erlaubt.'; return; }
  $('hint').textContent = 'Modell wird geladen …';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Datei nicht gefunden (' + res.status + ')');
    load(await res.arrayBuffer(), decodeURIComponent(url.pathname.split('/').pop()));
  } catch (e) {
    $('hint').textContent = 'Konnte das Modell nicht laden: ' + e.message;
  }
}

$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

$('bRot').onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); };
$('bWire').onclick = e => { wire = !wire; e.target.classList.toggle('on', wire); applyWire(); };
$('bMirror').onclick = e => { mirrorMode = !mirrorMode; e.target.classList.toggle('on', mirrorMode); setMirrors(mirrorMode); };
// Hintergrundfarben: Weiß, mittleres Grau, Schwarz (Standard)
const BGS = {
  white: { hex: 0xffffff, css: '#ffffff', fg: '#222222', sub: '#666666' },
  gray:  { hex: 0x808080, css: '#808080', fg: '#ffffff', sub: '#e6e6e6' },
  black: { hex: 0x000000, css: '#000000', fg: '#dddddd', sub: '#888888' }
};
function setBg(key) {
  const b = BGS[key];
  if (!b) return;
  scene.background = new THREE.Color(b.hex);
  document.body.style.background = b.css;
  document.documentElement.style.setProperty('--fg', b.fg);
  document.documentElement.style.setProperty('--sub', b.sub);
  document.querySelectorAll('#menuBg button').forEach(x => x.classList.toggle('on', x.dataset.bg === key));
}
const menuBg = $('menuBg');
$('bBg').onclick = e => { e.stopPropagation(); menuBg.classList.toggle('open'); };
menuBg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  setBg(b.dataset.bg);
  menuBg.classList.remove('open');
});
addEventListener('click', () => menuBg.classList.remove('open'));
$('bAxis').onclick = e => {
  tilted = !tilted;
  e.target.classList.toggle('on', tilted);
  if (pivot) { pivot.rotation.x = tilted ? -Math.PI / 2 : 0; frame(); }
};
$('bReset').onclick = frame;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// Optionen per Link: &tilt=1 (Achse kippen), &rotate=1 (Auto-Drehen), &ui=0 (Knöpfe ausblenden)
if (params.get('tilt') === '1') { tilted = true; $('bAxis').classList.add('on'); }
if (params.get('rotate') === '1') { controls.autoRotate = true; $('bRot').classList.add('on'); }
const bgAlias = { weiss: 'white', weiß: 'white', white: 'white', grau: 'gray', gray: 'gray', schwarz: 'black', black: 'black' };
if (params.get('bg')) setBg(bgAlias[params.get('bg').toLowerCase()]);
if (params.get('mirror') === '1') { mirrorMode = true; $('bMirror').classList.add('on'); }
if (params.get('ui') === '0') $('ui').style.display = 'none';

if (params.get('model')) {
  $('openLabel').style.display = 'none';
  loadFromUrl(params.get('model'));
}
</script>
</body>
</html>
