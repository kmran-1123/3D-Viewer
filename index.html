<body>

      <path d="M12 2.5v4.75M20.5 7.25l-4.25 2.375M20.5 16.75l-4.25-2.375M12 21.5v-4.75M3.5 16.75l4.25-2.375M3.5 7.25l4.25 2.375"/>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
// Weiche Schatten: werden nur neu berechnet, wenn sich etwas ändert (spart Akku, besonders am Handy)
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const pmrem = new THREE.PMREMGenerator(renderer);

// Studio-Umgebung mit hellen Lichtflächen: ergibt scharfe, kontrastreiche Spiegelungen
function makeStudioEnv() {
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(
    new THREE.BoxGeometry(24, 24, 24),
    new THREE.MeshBasicMaterial({ color: 0x23262c, side: THREE.BackSide })
  ));
  const panel = (w, h, x, y, z, level) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(level, level, level), side: THREE.DoubleSide })
    );
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    env.add(m);
  };
  // Die Umgebung liefert nur noch sanftes Grundlicht; das gerichtete Licht (unten) erzeugt Schatten und Form.
  panel(12, 12, 0, 11.5, 0, 2.2);     // große Fläche oben
  panel(3, 10, -11.5, 2, 4, 3.5);     // Streifen links
  panel(3, 10, 11.5, 2, -4, 3.5);     // Streifen rechts
  panel(10, 3, 0, 1, 11.5, 1.8);      // Fläche vorne
  panel(14, 14, 0, -11.5, 0, 0.8);    // schwacher Boden
  return pmrem.fromScene(env, 0.01).texture;
}
scene.environment = makeStudioEnv();

scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 0.35));

// Lichtaufbau wie im Studio: Hauptlicht (aus vier leicht versetzten Lichtern = weiche Schattenränder
// wie bei einer großen Softbox) und ein schwächeres Fülllicht von der Gegenseite.
const shadowLights = [];
function addShadowLight(intensity, dirVec) {
  const l = new THREE.DirectionalLight(0xffffff, intensity);
  l.castShadow = true;
  l.shadow.mapSize.set(1024, 1024);
  scene.add(l, l.target);
  shadowLights.push({ l, dir: dirVec.clone().normalize() });
}
{
  const KEY = new THREE.Vector3(-0.5, 1.0, 0.8).normalize();
  const FILL = new THREE.Vector3(0.9, 0.45, 0.35).normalize();
  const u = new THREE.Vector3().crossVectors(KEY, new THREE.Vector3(0, 1, 0)).normalize();
  const v = new THREE.Vector3().crossVectors(u, KEY).normalize();
  const s = 0.2;                                           // ca. 11° Streuung
  for (const [a, b] of [[1, 1], [-1, 1], [1, -1], [-1, -1]])
    addShadowLight(1.3, KEY.clone().addScaledVector(u, a * s).addScaledVector(v, b * s));
  addShadowLight(1.2, FILL);
}

// Lichter und Schatten-Bereich an die Größe des Modells anpassen
function fitLights(box) {
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const R = sphere.radius || 1;
  for (const { l, dir } of shadowLights) {
    l.position.copy(sphere.center).addScaledVector(dir, R * 4);
    l.target.position.copy(sphere.center);
    l.target.updateMatrixWorld();
    const c = l.shadow.camera, e = R * 1.05;
    c.left = -e; c.right = e; c.top = e; c.bottom = -e;
    c.near = R * 0.5; c.far = R * 8;
    c.updateProjectionMatrix();
    l.shadow.bias = -0.0004;
    l.shadow.normalBias = R * 0.004;
  }
  renderer.shadowMap.needsUpdate = true;
}

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 10000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotateSpeed = 2;

let pivot = null, tilted = false, wire = false, mirrorMode = false;
// Knickwinkel fürs Glätten (Grad); per Link abschaltbar mit &smooth=0
const SMOOTH_DEG = params.has('smooth') ? Math.max(0, Math.min(80, Number(params.get('smooth')) || 0)) : 40;

function disposeModel() {
  if (!pivot) return;
  restoreMirrors(pivot);
  scene.remove(pivot);
  pivot.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) [].concat(o.material).forEach(m => m.dispose());
    if (o.getRenderTarget) o.getRenderTarget().dispose();   // Spiegel
  });
  pivot = null;
}

function frame() {
  if (!pivot) return;
  pivot.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  camera.position.copy(center).add(new THREE.Vector3(1, 0.7, 1).normalize().multiplyScalar(dist));
  controls.target.copy(center);
  controls.update();
  fitLights(box);
}

function applyWire() {
  if (!pivot) return;
  pivot.traverse(o => {
    if (o.material) [].concat(o.material).forEach(m => m.wireframe = wire);
  });
}

// SMOOTH-BEGIN
// Glättet die Schattierung über Flächengrenzen hinweg: Normalen an gleichen Eckpunkten werden
// gemittelt, solange der Winkel zwischen den Flächen unter dem Knickwinkel bleibt. Harte Kanten
// bleiben hart. posList: je Mesh ein Float64Array (Weltkoordinaten, nicht indiziert, 9 Werte je Dreieck).
function smoothNormalsCore(posList, tol, cosT) {
  const inv = 1 / tol;
  const triU = [], triW = [], vertGroup = [];
  const groupId = new Map(), groups = [];
  posList.forEach((p, mi) => {
    const nt = p.length / 9;
    const U = new Float64Array(nt * 3), W = new Float64Array(nt * 3), VG = new Int32Array(nt * 3);
    for (let t = 0; t < nt; t++) {
      const o = t * 9;
      const ax = p[o + 3] - p[o], ay = p[o + 4] - p[o + 1], az = p[o + 5] - p[o + 2];
      const bx = p[o + 6] - p[o], by = p[o + 7] - p[o + 1], bz = p[o + 8] - p[o + 2];
      const nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      const len = Math.hypot(nx, ny, nz);
      W[t * 3] = nx; W[t * 3 + 1] = ny; W[t * 3 + 2] = nz;            // Fläche als Gewicht
      if (len > 1e-18) { U[t * 3] = nx / len; U[t * 3 + 1] = ny / len; U[t * 3 + 2] = nz / len; }
      for (let c = 0; c < 3; c++) {
        const k = Math.round(p[o + c * 3] * inv) + ',' + Math.round(p[o + c * 3 + 1] * inv) + ',' + Math.round(p[o + c * 3 + 2] * inv);
        let id = groupId.get(k);
        if (id === undefined) { id = groups.length; groupId.set(k, id); groups.push([]); }
        groups[id].push(mi, t);
        VG[t * 3 + c] = id;
      }
    }
    triU.push(U); triW.push(W); vertGroup.push(VG);
  });
  return posList.map((p, mi) => {
    const nt = p.length / 9;
    const out = new Float64Array(nt * 9);
    const U = triU[mi], VG = vertGroup[mi];
    for (let t = 0; t < nt; t++) {
      const ux = U[t * 3], uy = U[t * 3 + 1], uz = U[t * 3 + 2];
      for (let c = 0; c < 3; c++) {
        const g = groups[VG[t * 3 + c]];
        let sx = 0, sy = 0, sz = 0, ax = 0, ay = 0, az = 0;
        for (let i = 0; i < g.length; i += 2) {
          const Uj = triU[g[i]], Wj = triW[g[i]], tj = g[i + 1] * 3;
          ax += Wj[tj]; ay += Wj[tj + 1]; az += Wj[tj + 2];
          if (ux * Uj[tj] + uy * Uj[tj + 1] + uz * Uj[tj + 2] >= cosT) { sx += Wj[tj]; sy += Wj[tj + 1]; sz += Wj[tj + 2]; }
        }
        let len = Math.hypot(sx, sy, sz);
        if (len < 1e-18) { sx = ax; sy = ay; sz = az; len = Math.hypot(sx, sy, sz); }   // entartetes Dreieck
        const o = t * 9 + c * 3;
        if (len < 1e-18) { out[o] = 0; out[o + 1] = 1; out[o + 2] = 0; }
        else { out[o] = sx / len; out[o + 1] = sy / len; out[o + 2] = sz / len; }
      }
    }
    return out;
  });
}
// SMOOTH-END

function smoothNormals(root, creaseDeg) {
  root.updateMatrixWorld(true);
  const meshes = [];
  root.traverse(o => {
    if (o.isMesh && !Array.isArray(o.material) && o.geometry && o.geometry.attributes.position) meshes.push(o);
  });
  if (!meshes.length) return;
  const diag = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3()).length() || 1;
  const v = new THREE.Vector3();
  const posList = meshes.map(m => {
    if (m.geometry.index) {                                  // Dreiecke einzeln, damit jede Ecke ihre eigene Normale bekommt
      const g = m.geometry.toNonIndexed();
      m.geometry.dispose();
      m.geometry = g;
    }
    const p = m.geometry.attributes.position;
    const arr = new Float64Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld);
      arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z;
    }
    return arr;
  });
  const normals = smoothNormalsCore(posList, diag * 2e-5, Math.cos(creaseDeg * Math.PI / 180));
  meshes.forEach((m, k) => {
    const nw = normals[k], e = m.matrixWorld.elements, out = new Float32Array(nw.length);
    for (let i = 0; i < nw.length; i += 3) {                 // zurück in den Raum des Meshes (transponierte 3x3-Matrix)
      const x = nw[i], y = nw[i + 1], z = nw[i + 2];
      const lx = e[0] * x + e[1] * y + e[2] * z;
      const ly = e[4] * x + e[5] * y + e[6] * z;
      const lz = e[8] * x + e[9] * y + e[10] * z;
      const l = Math.hypot(lx, ly, lz) || 1;
      out[i] = lx / l; out[i + 1] = ly / l; out[i + 2] = lz / l;
    }
    m.geometry.setAttribute('normal', new THREE.BufferAttribute(out, 3));
  });
}

// Rhino exportiert Gips & Co. mit Brechungsindex 1.0 und ohne Rauheit: das ergibt völlig stumpfe,
// flache Flächen. Hier werden realistische Werte gesetzt (nur bei nichtmetallischen Materialien).
function tuneMaterials(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    [].concat(o.material).forEach(m => {
      if (!m.isMeshStandardMaterial || m.metalness >= 0.5) return;
      if (m.isMeshPhysicalMaterial && m.ior < 1.2) m.ior = 1.5;
      if (m.roughness > 0.55) m.roughness = 0.55;
      m.needsUpdate = true;
    });
  });
}

// Alle Flächen werfen und empfangen Schatten (außer den Spiegeln); Schatten neu berechnen lassen
function refreshShadows() {
  if (!pivot) return;
  pivot.traverse(o => {
    if (!o.isMesh) return;
    o.castShadow = !(o.userData && o.userData.originalMesh);
    o.receiveShadow = true;
  });
  renderer.shadowMap.needsUpdate = true;
}

// MIRRORS-BEGIN
// Echte Spiegel: ebene Flächen mit Vollmetall-Material (Metall >= 0.9, Rauheit <= 0.1)
// werden durch einen Reflector ersetzt, der die Szene wirklich spiegelt.
function makeMirrors(root) {
  const found = [];
  root.traverse(o => {
    if (!o.isMesh || Array.isArray(o.material)) return;
    const m = o.material;
    if (m.metalness >= 0.9 && m.roughness <= 0.1) found.push(o);
  });
  const made = [];
  for (const mesh of found) {
    const parent = mesh.parent;
    if (!parent) continue;
    const geo = mesh.geometry.clone();
    geo.applyMatrix4(mesh.matrix);                       // in den Raum des Elternobjekts
    const pos = geo.attributes.position;
    const idx = geo.index;
    const ia = idx ? idx.getX(0) : 0, ib = idx ? idx.getX(1) : 1, ic = idx ? idx.getX(2) : 2;
    const va = new THREE.Vector3().fromBufferAttribute(pos, ia);
    const vb = new THREE.Vector3().fromBufferAttribute(pos, ib);
    const vc = new THREE.Vector3().fromBufferAttribute(pos, ic);
    const n = vb.sub(va).cross(vc.sub(va)).normalize();  // Flächennormale (zeigt zur Vorderseite)
    geo.computeBoundingBox();
    const center = geo.boundingBox.getCenter(new THREE.Vector3());
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);
    geo.translate(-center.x, -center.y, -center.z);
    geo.applyQuaternion(q.clone().invert());             // Fläche liegt jetzt in der lokalen XY-Ebene
    geo.computeBoundingBox();
    const size = geo.boundingBox.getSize(new THREE.Vector3());
    if (size.z > Math.max(size.x, size.y) * 1e-3) { geo.dispose(); continue; }   // nicht eben: normal lassen
    const dpr = renderer.getPixelRatio();
    const mirror = new Reflector(geo, {
      color: new THREE.Color().setRGB(0.5, 0.5, 0.5, THREE.LinearSRGBColorSpace),  // neutral, keine Färbung
      textureWidth: Math.round(Math.min(1600, innerWidth * dpr)),
      textureHeight: Math.round(Math.min(1600, innerHeight * dpr)),
      clipBias: size.length() * 0.0005
    });
    mirror.name = (mesh.name || 'mirror') + '_reflector';
    mirror.position.copy(center);
    mirror.quaternion.copy(q);
    mirror.userData.originalMesh = mesh;                 // zum Zurückschalten merken
    parent.add(mirror);
    parent.remove(mesh);
    made.push(mirror);
  }
  return made;
}
// MIRRORS-END

// Spiegel wieder durch die ursprünglichen Flächen ersetzen
function restoreMirrors(root) {
  const list = [];
  root.traverse(o => { if (o.userData && o.userData.originalMesh) list.push(o); });
  for (const r of list) {
    const parent = r.parent;
    if (parent) { parent.add(r.userData.originalMesh); parent.remove(r); }
    r.geometry.dispose();
    r.material.dispose();
    r.getRenderTarget().dispose();
  }
}

function setMirrors(on) {
  if (!pivot) return;
  if (on) {
    try { makeMirrors(pivot); } catch (e) { console.warn('Spiegel nicht möglich:', e); }
    applyWire();
  } else {
    restoreMirrors(pivot);
  }
  refreshShadows();
}

function setModel(obj, name) {
  disposeModel();
  pivot = new THREE.Group();
  pivot.add(obj);
  try { tuneMaterials(obj); } catch (e) { console.warn('Materialien:', e); }
  if (SMOOTH_DEG > 0) {
    try { smoothNormals(obj, SMOOTH_DEG); } catch (e) { console.warn('Glätten nicht möglich:', e); }
  }
  if (mirrorMode) setMirrors(true);
  pivot.rotation.x = tilted ? -Math.PI / 2 : 0;
  applyWire();
  scene.add(pivot);
  refreshShadows();
  frame();
  $('hint').style.display = 'none';
  $('msg').textContent = name;
}

// VRML (.wrl): einfache Phong-/Lambert-Materialien in physikalische Materialien umwandeln,
// damit Licht, Schatten und Glanz wie bei den anderen Formaten aussehen
function vrmlMaterials(root) {
  const sky = [];                                            // Sicherheitsnetz: übrig gebliebene Hintergrundkugeln
  root.traverse(o => {
    const m = o.isMesh && o.material;
    if (m && !Array.isArray(m) && m.depthTest === false && m.depthWrite === false) sky.push(o);
  });
  sky.forEach(o => { if (o.parent) o.parent.remove(o); });
  root.traverse(o => {
    if (!o.isMesh) return;
    const list = [].concat(o.material).map(m => {
      if (!m.isMeshPhongMaterial && !m.isMeshLambertMaterial) return m;
      const s = new THREE.MeshStandardMaterial({
        color: m.color, roughness: 0.5, metalness: 0, side: THREE.DoubleSide,
        transparent: m.transparent, opacity: m.opacity
      });
      m.dispose();
      return s;
    });
    o.material = Array.isArray(o.material) ? list : list[0];
  });
}

// VRML-BEGIN
// Entfernt Knoten, die nur Kamera/Hintergrund beschreiben (z. B. "Background" würde sonst eine
// Riesenkugel um das Modell erzeugen). Jeder Knoten wird durch eine leere Gruppe ersetzt, damit die
// Datei gültig bleibt, auch wenn der Knoten als einziges Kind stand.
function stripVrmlNodes(text) {
  const names = ['WorldInfo', 'NavigationInfo', 'Viewpoint', 'Background', 'Fog'];
  const re = new RegExp('\\b(?:' + names.join('|') + ')\\s*\\{', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index < last) continue;
    let depth = 1, i = re.lastIndex, inStr = false;
    for (; i < text.length && depth > 0; i++) {
      const ch = text[i];
      if (inStr) { if (ch === '\\') i++; else if (ch === '"') inStr = false; }
      else if (ch === '"') inStr = true;
      else if (ch === '#') { while (i < text.length && text[i] !== '\n') i++; }
      else if (ch === '{') depth++;
      else if (ch === '}') depth--;
    }
    if (depth !== 0) break;                                  // unvollständig: nichts mehr anfassen
    out += text.slice(last, m.index) + 'Group {}';
    last = i;
    re.lastIndex = i;
  }
  return out + text.slice(last);
}
// VRML-END

async function load(buffer, name) {
  const ext = name.split('.').pop().toLowerCase();
  try {
    // VRML-Dateien aus CAD/Rhino/GAM haben meist Z nach oben (VRML selbst sieht Y vor): dann automatisch kippen.
    // Per Link überschreibbar mit &tilt=0 oder &tilt=1.
    if (!params.has('tilt')) {
      tilted = (ext === 'wrl' || ext === 'vrml');
      $('bAxis').classList.toggle('on', tilted);
    }
    if (ext === 'wrl' || ext === 'vrml') {
      const text = new TextDecoder().decode(buffer);
      const ver = /^\s*#VRML\s+V(\d+)\.\d+/i.exec(text);
      if (!ver) throw new Error('keine gültige VRML-Datei');
      if (ver[1] !== '2') throw new Error('nur VRML 2.0 wird unterstützt (in Rhino als „VRML 2.0" exportieren)');
      const { VRMLLoader } = await import('three/addons/loaders/VRMLLoader.js');   // wird nur bei .wrl geladen
      const obj = new VRMLLoader().parse(stripVrmlNodes(text), '');
      vrmlMaterials(obj);
      setModel(obj, name);
    } else if (ext === 'obj') {
      const obj = new OBJLoader().parse(new TextDecoder().decode(buffer));
      const mat = new THREE.MeshStandardMaterial({ color:0xcccccc, roughness:0.6, metalness:0.1, side:THREE.DoubleSide });
      obj.traverse(o => { if (o.isMesh) o.material = mat; });
      setModel(obj, name);
    } else {
      new GLTFLoader().parse(buffer, '', gltf => setModel(gltf.scene, name),
        err => { $('msg').textContent = 'Fehler beim Laden: ' + (err.message || err); });
    }
  } catch (e) {
    $('msg').textContent = 'Fehler beim Laden: ' + e.message;
  }
}

// Kein "accept" am Dateifeld: Android-Handys (v. a. Samsung) blenden Dateien mit unbekannter Endung wie .wrl
// sonst grau aus. Die Endung wird deshalb hier geprüft.
const OK_EXT = ['glb', 'gltf', 'obj', 'wrl', 'vrml'];
async function loadFile(file) {
  const ext = (file.name.includes('.') ? file.name.split('.').pop() : '').toLowerCase();
  if (!OK_EXT.includes(ext)) {
    $('msg').textContent = 'Format nicht unterstützt' + (ext ? ' (.' + ext + ')' : '') + ' – möglich: .glb, .gltf, .obj, .wrl';
    return;
  }
  $('msg').textContent = file.name + ' wird geladen …';
  load(await file.arrayBuffer(), file.name);
}

// Modell per Link laden:  ...?model=meinmodell.glb
async function loadFromUrl(path) {
  const url = new URL(path, location.href);
  if (url.origin !== location.origin) { $('msg').textContent = 'Nur Modelle von dieser Seite erlaubt.'; return; }
  $('hint').textContent = 'Modell wird geladen …';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Datei nicht gefunden (' + res.status + ')');
    load(await res.arrayBuffer(), decodeURIComponent(url.pathname.split('/').pop()));
  } catch (e) {
    $('hint').textContent = 'Konnte das Modell nicht laden: ' + e.message;
  }
}

$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); });

$('bRot').onclick = e => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); };
$('bWire').onclick = e => { wire = !wire; e.target.classList.toggle('on', wire); applyWire(); };
$('bMirror').onclick = e => { mirrorMode = !mirrorMode; e.target.classList.toggle('on', mirrorMode); setMirrors(mirrorMode); };
// Hintergrundfarben: Weiß, mittleres Grau, Schwarz (Standard)
const BGS = {
  white: { hex: 0xffffff, css: '#ffffff', fg: '#222222', sub: '#666666' },
  gray:  { hex: 0x808080, css: '#808080', fg: '#ffffff', sub: '#e6e6e6' },
  black: { hex: 0x000000, css: '#000000', fg: '#dddddd', sub: '#888888' }
};
function setBg(key) {
  const b = BGS[key];
  if (!b) return;
  scene.background = new THREE.Color(b.hex);
  document.body.style.background = b.css;
  document.documentElement.style.setProperty('--fg', b.fg);
  document.documentElement.style.setProperty('--sub', b.sub);
  document.querySelectorAll('#menuBg button').forEach(x => x.classList.toggle('on', x.dataset.bg === key));
}
const menuBg = $('menuBg');
$('bBg').onclick = e => { e.stopPropagation(); menuBg.classList.toggle('open'); };
menuBg.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  setBg(b.dataset.bg);
  menuBg.classList.remove('open');
});
addEventListener('click', () => menuBg.classList.remove('open'));
$('bAxis').onclick = e => {
  tilted = !tilted;
  e.target.classList.toggle('on', tilted);
  if (pivot) { pivot.rotation.x = tilted ? -Math.PI / 2 : 0; frame(); }
};
$('bReset').onclick = frame;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// Optionen per Link: &tilt=1 (Achse kippen), &rotate=1 (Auto-Drehen), &ui=0 (Knöpfe ausblenden)
if (params.get('tilt') === '1') { tilted = true; $('bAxis').classList.add('on'); }
if (params.get('rotate') === '1') { controls.autoRotate = true; $('bRot').classList.add('on'); }
const bgAlias = { weiss: 'white', weiß: 'white', white: 'white', grau: 'gray', gray: 'gray', schwarz: 'black', black: 'black' };
if (params.get('bg')) setBg(bgAlias[params.get('bg').toLowerCase()]);
if (params.get('mirror') === '1') { mirrorMode = true; $('bMirror').classList.add('on'); }
if (params.get('ui') === '0') $('ui').style.display = 'none';

if (params.get('model')) {
  $('openLabel').style.display = 'none';
  loadFromUrl(params.get('model'));
}
</script>
</body>
</html>
